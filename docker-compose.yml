services:
  openplc:
    build: https://github.com/thiagoralves/OpenPLC_v3.git
    container_name: industrial-openplc
    ports:
      - "728:502"
      - "8306:8080"
    privileged: true
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: industrial-influxdb
    ports:
      - "8312:8086"
    environment:
      - INFLUXDB_DB=industrial_db
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=password
    volumes:
      - influxdb-data:/var/lib/influxdb2
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: industrial-grafana
    ports:
      - "3226:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - influxdb
    restart: unless-stopped

  nodered:
    image: nodered/node-red:latest
    container_name: industrial-nodered
    ports:
      - "2106:1880"
    volumes:
      - ./nodered-data:/data
    restart: unless-stopped

volumes:
  influxdb-data:
  grafana-data:
